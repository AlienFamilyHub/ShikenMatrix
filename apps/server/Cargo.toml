[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws", "json"] }
base64 = "0.22.1"
bcrypt = "0.19.2"
futures-util = { version = "0.3.32", features = ["sink"] }
getrandom = { version = "0.4.3", features = ["std", "sys_rng"] }
hmac = "0.13.0"
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }
mime_guess = "2.0.5"
rand = "0.10.1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
rust-embed = { version = "8.7.2", features = ["compression"] }
rustls = "0.23.41"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
time = { version = "0.3.51", features = ["formatting"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["rustls-tls-webpki-roots", "connect"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = "2.5.8"
webpki-roots = "1.0.8"
