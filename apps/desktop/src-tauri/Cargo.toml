[package]
name = "shikenmatrix"
version = "2.0.0"
description = "A Tauri App"
authors = [ "you" ]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "shikenmatrix_lib"
crate-type = [
  "staticlib",
  "cdylib",
  "rlib"
]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = [
  "tray-icon",
  "image-png"
] }
tauri-plugin-opener = "2.5.4"
serde = { version = "1.0.228", features = [ "derive" ] }
serde_json = "1.0.150"
toml = "1.1.2"
dirs = "6.0.0"
base64 = "0.22.1"
tokio = { version = "1.52.3", features = [
  "rt-multi-thread",
  "sync",
  "time",
  "macros",
  "signal",
], default-features = false }
tokio-tungstenite = { version = "0.29.0", features = [
  "rustls-tls-webpki-roots",
  "connect",
], default-features = false }
rustls = { version = "0.23.41", default-features = false, features = [
  "std",
  "tls12",
  "ring",
] }
webpki-roots = "1.0.8"
futures-util = { version = "0.3.32", default-features = false, features = [ "std", ] }
url = "2.5.8"
tracing = { version = "0.1.44", default-features = false, features = [ "std" ] }
tracing-subscriber = { version = "0.3.23", features = [
  "env-filter",
  "fmt"
] }
image = "0.25.10"
reqwest = { version = "0.13.4", default-features = false, features = [
  "json",
  "rustls",
] }
hmac = "0.13.0"
sha2 = "0.11.0"
time = { version = "0.3.51", features = [ "formatting" ] }

# macOS dependencies
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
objc2 = { version = "0.6.4", default-features = false }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "NSString",
  "NSDictionary",
  "NSURL",
  "NSData",
  "alloc",
  "NSGeometry",
  "objc2-core-foundation",
] }
mediaremote-rs = "0.2.0"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "NSRunningApplication",
  "NSWorkspace",
  "NSImage",
  "NSBitmapImageRep",
  "NSImageRep",
  "libc",
  "objc2-core-graphics",
  "NSGraphicsContext",
] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [ "CGImage", ] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_ProcessStatus",
  "Media_Control",
  "Storage_Streams",
] }
